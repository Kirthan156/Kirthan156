<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .7s ease-out forwards; } @keyframes grow { to { transform: scaleX(1); } }
</style>
<rect x="0.5" y="0.5" width="479" height="229" rx="12" fill="#0d1117" stroke="#30363d"/>

<text class="sans" x="24" y="36" font-size="15" font-weight="600" fill="#e6edf3">Most used languages</text>
<rect x="24" y="52" width="432" height="8" rx="2" fill="#161b22"/>
<clipPath id="barclip"><rect x="24" y="52" width="432" height="8" rx="4"/></clipPath>
<g clip-path="url(#barclip)"><rect class="grow" style="animation-delay:0.00s" x="24.0" y="52" width="253.4" height="8" rx="2" fill="#DA5B0B"/><rect class="grow" style="animation-delay:0.08s" x="279.4" y="52" width="84.8" height="8" rx="2" fill="#3572A5"/><rect class="grow" style="animation-delay:0.16s" x="366.2" y="52" width="78.0" height="8" rx="2" fill="#f1e05a"/><rect class="grow" style="animation-delay:0.24s" x="446.3" y="52" width="7.7" height="8" rx="2" fill="#f34b7d"/></g>
<g class="fade" style="animation-delay:0.20s"><circle cx="29" cy="94" r="5" fill="#DA5B0B"/><text class="sans" x="42" y="98" font-size="13" fill="#e6edf3">Jupyter Notebook</text><text class="mono" x="224" y="98" font-size="12" fill="#8b949e" text-anchor="end">59.1%</text></g><g class="fade" style="animation-delay:0.28s"><circle cx="257" cy="94" r="5" fill="#3572A5"/><text class="sans" x="270" y="98" font-size="13" fill="#e6edf3">Python</text><text class="mono" x="452" y="98" font-size="12" fill="#8b949e" text-anchor="end">20.1%</text></g><g class="fade" style="animation-delay:0.36s"><circle cx="29" cy="134" r="5" fill="#f1e05a"/><text class="sans" x="42" y="138" font-size="13" fill="#e6edf3">JavaScript</text><text class="mono" x="224" y="138" font-size="12" fill="#8b949e" text-anchor="end">18.5%</text></g><g class="fade" style="animation-delay:0.44s"><circle cx="257" cy="134" r="5" fill="#f34b7d"/><text class="sans" x="270" y="138" font-size="13" fill="#e6edf3">C++</text><text class="mono" x="452" y="138" font-size="12" fill="#8b949e" text-anchor="end">2.3%</text></g>

