name: Update profile

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build banner and stats cards
        env:
          # Public contributions only. Add a classic PAT with read:user as METRICS_TOKEN
          # to include private contributions.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update profile assets"
          git push

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0f766e&color_dots=#eef1f4,#a7e3d8,#5ccfbd,#14a08f,#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#0f3d38,#11665c,#14a08f,#2dd4bf

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
